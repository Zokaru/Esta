[project]
name = "esta"
version = "0.1.2"
description = "Minimal static site generator"
keywords = ["static-site-generator", "html", "css-bundling", "js-bundling", "localisation", "html-templating"]
readme = "README.md"
requires-python = ">=3.7"
dependencies = []
license = "GPL-3.0-only"
license-files = ["LICEN[CS]E*"]
authors = [
    { name = "Daniel Sánchez", email = "danielsanchez_2@hotmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Text Processing :: Markup :: HTML",
]

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project.scripts]
esta = "esta.esta:main"

[project.urls]
# Homepage = "https://github.com/Zokaru/Esta/"
